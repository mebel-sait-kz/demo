<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1722">
  <title>Заявка на спецтехнику — демо</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="app.css?v=2">
</head>
<body>
  <header class="top">
    <div class="wrap top__in">
      <a class="brand" href="#catalog">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 17h11v-4H6l-1 4"/><circle cx="6" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><path d="M14 13l3-7 4 4-2 3h-3"/></svg>
        </span>
        <span class="brand__text"><strong data-c="name"></strong><small data-c="sub"></small></span>
      </a>
      <div class="top__meta">
        <span class="meta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-c="city"></span></span>
        <span class="meta"><i class="dot" aria-hidden="true"></i><span data-c="hours"></span></span>
      </div>
      <div class="top__act">
        <div class="lang" role="group" aria-label="Язык / Тіл">
          <button type="button" data-lang="ru">RU</button><button type="button" data-lang="kk">KZ</button>
        </div>
        <a class="btn btn--accent btn--sm top__cta" href="#details" data-t="cta"></a>
      </div>
    </div>
  </header>

  <main>
    <section class="wrap hero" id="catalog">
      <div>
        <p class="eyebrow" data-t="eyebrow"></p>
        <h1 data-t="h1"></h1>
      </div>
      <div class="hero__side">
        <p data-t="heroLead"></p>
        <ol class="flow">
          <li><b>1</b><span data-t="flow1"></span></li>
          <li><b>2</b><span data-t="flow2"></span></li>
          <li><b>3</b><span data-t="flow3"></span></li>
        </ol>
      </div>
    </section>

    <section class="wrap">
      <div class="cards" id="cards"></div>
    </section>

    <section class="wrap details" id="details">
      <p class="eyebrow" data-t="calcEyebrow"></p>
      <h2 data-t="h2"></h2>
      <p class="lead" data-t="h2lead"></p>
      <div class="details__grid">
        <form class="panel form" id="form" novalidate></form>
        <aside class="summary" id="summary" aria-live="polite"></aside>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot__in">
      <div>
        <strong data-c="name"></strong>
        <span data-c="sub"></span>
      </div>
      <a class="foot__owner" id="ownerLink" href="owner.html" data-t="owner"></a>
    </div>
    <p class="wrap demo" id="demo" data-t="demo"></p>
  </footer>

  <a class="mbar" id="mbar" href="#summary"></a>

  <script src="config.js?v=1"></script>
  <script src="store.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
